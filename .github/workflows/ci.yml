# CI: same quality gates as `just quality-check` + `just test-cov`.
# If it passes locally with those two commands, it passes in the PR.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality-and-test:
    name: "quality + test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Install Ubuntu system deps (PortAudio, PulseAudio, xvfb for headless pynput)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio xvfb

      # Ubuntu's PortAudio (19.7.0+git2026, from ubuntu-26.04) has a PulseAudio host
      # API, and Pa_Initialize fails outright when no PulseAudio server answers, so
      # `import sounddevice` raises. Run a server with a null sink: its monitor is the
      # default input, so the capture tests run against real PortAudio, headless.
      - name: Start PulseAudio with a null sink (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_null
          pactl set-default-sink ci_null
          pactl set-default-source ci_null.monitor
          pactl info

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Quality check (same as just quality-check)
        run: just quality-check

      - name: Tests with coverage (Ubuntu; xvfb for headless pynput)
        if: matrix.os == 'ubuntu-latest'
        run: xvfb-run just test-cov

      - name: Tests with coverage (macOS, Windows)
        if: matrix.os != 'ubuntu-latest'
        run: just test-cov

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: diff-cover patch-level gate
        if: github.event_name == 'pull_request' && matrix.os == 'ubuntu-latest'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
